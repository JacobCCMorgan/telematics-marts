# Local profile: a file-backed DuckDB database under data/. Run dbt with
#   DBT_PROFILES_DIR=. dbt build
telematics_marts:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "data/warehouse.duckdb"   # not marts.duckdb: the file name is the catalog, and a catalog named like a schema is ambiguous in DuckDB
      threads: 4
