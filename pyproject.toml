[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telematics-marts"
version = "0.1.0"
description = "The shared modeling layer of the fleet-data-lab portfolio: dbt on DuckDB over the de-identified telematics foundation tables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
