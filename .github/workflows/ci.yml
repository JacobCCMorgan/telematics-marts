name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check scripts tests
      - name: build the warehouse (snapshots in export order, models, dbt tests)
        run: ./scripts/build.sh
      - name: the committed exports, report and lineage must be what the build produces
        run: |
          python scripts/export_marts.py --check
          python scripts/write_report.py > /dev/null
          python scripts/lineage.py
          git diff --exit-code -- reports docs/lineage.mmd data/marts/manifest.json
      - run: pytest -q
      - name: dbt docs
        run: DBT_PROFILES_DIR=. dbt docs generate --static
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: target/static_index.html
          retention-days: 14
